    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Comment partager mes photos avec mes clients ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Uploadez vos photos, définissez un mot de passe et une date d'expiration, puis partagez le lien unique avec vos clients. Ils pourront télécharger les photos en qualité originale."
          }
        },
        {
          "@type": "Question",
          "name": "Les galeries sont-elles sécurisées ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, chaque galerie est protégée par un mot de passe unique et les données sont chiffrées avec SSL. Seuls les personnes disposant du lien et du mot de passe peuvent accéder aux photos."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps les galeries restent-elles accessibles ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vous définissez la durée de vie de chaque galerie. Elle peut aller de quelques jours à 180 jours selon votre abonnement. Après expiration, la galerie est automatiquement supprimée."
          }
        }
      ]
    }
    </script>
